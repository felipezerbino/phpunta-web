name: Publicar la web (phpunta.uy)

# Push a main → publica en la raíz de phpunta.uy por HTTPS, con el mismo receptor que usan las
# apps (receptor propio en la raíz: deployer/deploy.php, app web). Sube SOLO lo que cambió desde lo publicado
# (lo dice https://phpunta.uy/web-version.json). NUNCA borra nada del hosting: enviar.php,
# .htaccess y las carpetas de las apps quedan intactos (el receptor además lo impide).
# Secret necesario en ESTE repo: DEPLOY_TOKEN (= el contenido de deployer/deploy_token.txt de la raíz).
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 9 * * *'   # una vez por día: páginas de propiedades nuevas o con otro título (central de reservas)
  workflow_dispatch:
    inputs:
      completo:
        description: 'Subir TODO el sitio (no solo lo que cambió)'
        type: boolean
        default: false

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar la central de reservas (ES/PT/EN, una página por propiedad, SEO)
        env:
          # 'reservas' = la central publicada en phpunta.uy/reservas (y redirecciones en reservasnueva/);
          # 'reservasnueva' = oculta (noindex). Lo cambia el commit que la publica.
          RESERVAS_ES_DIR: reservasnueva
          COMPLETO: ${{ inputs.completo }}
        run: |
          # Lee /web/seo del backend (una vez por idioma) y arma la lista y cada ficha con las plantillas reservas/_lista.html y
          # reservas/_ficha.html. Si el backend no responde, arma solo las listas: las fichas publicadas quedan como están.
          python3 tools/generar-reservas.py https://phpunta-backend-production.up.railway.app fichas.txt || true
          touch fichas.txt
          # Solo se sube lo generado que CAMBIÓ respecto de lo publicado (reservas-manifest.json guarda la huella de cada página).
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          curl -s --max-time 30 -A "$UA" "https://phpunta.uy/reservas-manifest.json?n=$RANDOM" -o manifest-publicado.json || true
          python3 - <<'PY'
          import json, os
          try: viejo = json.load(open('manifest-publicado.json'))
          except Exception: viejo = {}
          try: nuevo = json.load(open('reservas-manifest.json'))
          except Exception: nuevo = {}
          completo = os.environ.get('COMPLETO') == 'true'
          lista = [l.strip() for l in open('fichas.txt').read().split('\n') if l.strip()]
          sub = [f for f in lista if completo or f == 'reservas-manifest.json' or viejo.get(f) != nuevo.get(f)]
          open('fichas.txt', 'w').write('\n'.join(sub) + ('\n' if sub else ''))
          print('Páginas generadas: %d · a subir (cambiaron): %d' % (len(lista), len(sub)))
          PY

      - name: Armar los lotes
        env:
          COMPLETO: ${{ inputs.completo }}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          PUB=$(curl -s --max-time 30 -A "$UA" "https://phpunta.uy/web-version.json?n=$RANDOM" | python3 -c "import json,sys
          try: print(json.load(sys.stdin).get('sha',''))
          except Exception: print('')" || true)
          echo "Publicado hoy: ${PUB:-desconocido}"
          # Primera vez (sin web-version.json): la base es el commit de importación, que es copia
          # exacta de lo que ya estaba publicado → no se re-suben los 30 MB (videos incluidos).
          [ -n "$PUB" ] || PUB=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          if [ "$COMPLETO" != "true" ] && git cat-file -e "$PUB^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=AMR "$PUB" HEAD > cambios.txt
          else
            echo "Subida completa"; git ls-files > cambios.txt
          fi
          cat fichas.txt >> cambios.txt   # las páginas generadas no están en git: van siempre
          python3 - <<'EOF'
          import os, re, json, zipfile, subprocess, datetime
          ok_ext = re.compile(r'\.(html|css|js|json|xml|txt|webmanifest|png|jpe?g|webp|gif|svg|ico|avif|mp4|webm|woff2?)$', re.I)
          files = []
          for f in open('cambios.txt').read().split('\n'):
              f = f.strip()
              if not f or not os.path.isfile(f): continue
              if re.search(r'(^|/)\.', f) or not ok_ext.search(f): continue
              if re.search(r'(^|/)_', f): continue   # plantillas (_ficha.html): no se publican
              if '/' in f and not re.match(r'^(assets|en|pt|reservas|reservasnueva|alquileres)/', f): continue
              if f in files: continue
              files.append(f)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          with open('web-version.json', 'w') as fh:
              json.dump({'sha': sha, 'publicado': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}, fh)
          # Lotes chicos: el PHP del hosting tiene un tope de subida que no conocemos (suele ser 2 MB).
          # Un archivo más grande que el lote va solo; si el hosting lo rechaza, el paso siguiente lo dice.
          lotes, cur, size = [], [], 0
          for f in files:
              s = os.path.getsize(f)
              if cur and (size + s > 1500 * 1024 or len(cur) >= 250):
                  lotes.append(cur); cur, size = [], 0
              cur.append(f); size += s
          cur.append('web-version.json')   # siempre en el último lote: marca lo publicado al final
          lotes.append(cur)
          os.makedirs('lotes', exist_ok=True)
          for i, lote in enumerate(lotes):
              with zipfile.ZipFile(f'lotes/{i:03d}.zip', 'w', zipfile.ZIP_DEFLATED) as z:
                  for f in lote: z.write(f, f)
          print(f'{len(files)} archivos en {len(lotes)} lote(s)')
          for f in files: print('  ' + f)
          EOF

      - name: Publicar por HTTPS
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "Falta el secret DEPLOY_TOKEN en este repo"; exit 1; }
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          URL="https://phpunta.uy/limpiezas/deployer/deploy.php"   # acepta el token de la web solo para app=web (11-nov-2026)
          for Z in lotes/*.zip; do
            ok=""
            for intento in 1 2 3 4; do
              : > resp.json
              code=$(curl -sS -o resp.json -w "%{http_code}" --max-time 180 -A "$UA" -X POST \
                -H "X-Deploy-Token: $TOKEN" -F "app=web" -F "zip=@$Z" "$URL" 2>curlerr.txt) || true
              echo "$Z (intento $intento) → HTTP ${code:-sin-respuesta}"
              head -c 300 curlerr.txt || true; head -c 400 resp.json || true; echo
              if [ "$code" = "200" ] && grep -q '"ok":true' resp.json; then ok=1; break; fi
              if grep -qE '"php_error":(1|2)' resp.json; then
                echo "❌ El hosting rechaza este lote por tamaño (tope de subida de PHP). Archivos:"; unzip -Z1 "$Z"
                echo "Subilos a mano por el Administrador de archivos de cPanel o achicalos."; exit 1
              fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "❌ No se pudo publicar $Z"; exit 1; }
          done

      - name: Verificar lo publicado
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          PUB=$(curl -s --max-time 30 -A "$UA" "https://phpunta.uy/web-version.json?n=$RANDOM" | python3 -c "import json,sys;print(json.load(sys.stdin)['sha'])")
          echo "repo=$(git rev-parse HEAD) publicado=$PUB"
          [ "$PUB" = "$(git rev-parse HEAD)" ] && echo "✅ Web publicada"
