<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Página no encontrada | Premium Host Punta</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root { --navy: #0d1b2a; --gold: #c9a84c; --gold-deep: #a88c3a; --cream: #faf7f0; --text-soft: #556070; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--navy); color: var(--cream); font-family: 'Jost', system-ui, sans-serif; font-weight: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
.logo { width: 220px; max-width: 70vw; height: auto; margin-bottom: 40px; }
.eyebrow { color: var(--gold); font-size: 12px; letter-spacing: .28em; text-transform: uppercase; margin-bottom: 18px; }
h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.1; margin-bottom: 18px; }
h1 em { color: var(--gold); font-style: italic; }
p { max-width: 520px; color: rgba(250,247,240,.75); font-size: 16px; line-height: 1.7; margin: 0 auto 34px; }
.acc { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.acc a { display: inline-block; padding: 14px 26px; border: 1px solid var(--gold); color: var(--cream); text-decoration: none; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; border-radius: 2px; transition: background .2s, color .2s; }
.acc a.pri { background: var(--gold); color: var(--navy); font-weight: 500; }
.acc a:hover { background: var(--gold-deep); border-color: var(--gold-deep); color: var(--navy); }
</style>
</head>
<body>
<img class="logo" src="/assets/img/logo.webp" alt="Premium Host Punta" />
<div class="eyebrow" data-t="eyebrow">Error 404</div>
<h1 data-t="h1">Esta página <em>no existe.</em></h1>
<p data-t="p">Puede que la dirección esté mal escrita o que la página se haya movido. Te dejamos los caminos para seguir.</p>
<div class="acc">
  <a class="pri" href="/reservas/" data-t="reservas" data-h="reservas">Ver propiedades</a>
  <a href="/" data-t="inicio" data-h="inicio">Ir al inicio</a>
  <a href="/contacto.html" data-t="contacto" data-h="contacto">Contacto</a>
</div>
<script>
(function () {
  var p = location.pathname, l = /^\/en(\/|$)/.test(p) ? 'en' : /^\/pt(\/|$)/.test(p) ? 'pt' : 'es';
  if (l === 'es') return;
  var T = {
    en: { eyebrow: 'Error 404', h1: 'This page <em>doesn’t exist.</em>', p: 'The address may be mistyped or the page may have moved. Here are a few ways to continue.', reservas: 'See properties', inicio: 'Go to home', contacto: 'Contact', title: 'Page not found | Premium Host Punta' },
    pt: { eyebrow: 'Erro 404', h1: 'Esta página <em>não existe.</em>', p: 'O endereço pode estar errado ou a página pode ter sido movida. Aqui estão alguns caminhos para continuar.', reservas: 'Ver propriedades', inicio: 'Ir ao início', contacto: 'Contato', title: 'Página não encontrada | Premium Host Punta' }
  }[l];
  var H = { en: { reservas: '/en/reservas/', inicio: '/en/', contacto: '/en/contact.html' }, pt: { reservas: '/pt/reservas/', inicio: '/pt/', contacto: '/pt/contato.html' } }[l];
  document.documentElement.lang = l; document.title = T.title;
  document.querySelectorAll('[data-t]').forEach(function (e) { e.innerHTML = T[e.getAttribute('data-t')]; });
  document.querySelectorAll('[data-h]').forEach(function (e) { e.href = H[e.getAttribute('data-h')]; });
})();
</script>
</body>
</html>
